name: Native tests and Universal build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Use the runner's selected Xcode and macOS SDK
        shell: bash
        run: |
          set -euo pipefail
          developer_dir="$(/usr/bin/xcode-select -p)"
          [[ -d "$developer_dir" ]]
          printf 'DEVELOPER_DIR=%s\n' "$developer_dir" >> "$GITHUB_ENV"
          /usr/bin/xcodebuild -version
          /usr/bin/xcrun --sdk macosx --show-sdk-version

      - name: Run deterministic native suites
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash -n build.sh
          /bin/bash -n scripts/test.sh
          /usr/bin/plutil -lint Info.plist
          python3 scripts/check-docs.py
          ./scripts/test.sh

      - name: Build both architectures with verified deployment minima
        shell: bash
        env:
          ARCHS: universal
          REQUIRE_APP_ICON: '1'
        run: ./build.sh

      - name: Verify and package the ad-hoc build with corresponding source
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh --verify-only 2>&1 | tee build/validation.txt
          python3 scripts/prepare-release.py --app 'build/歇一会儿.app'

      # This is a CI artifact with a local ad-hoc signature. No release, Developer ID,
      # notarization, GUI smoke, real-device metadata flag, or audio capture is run here.
      - uses: actions/upload-artifact@v4
        with:
          name: RestReminder-validation-${{ github.run_number }}
          path: |
            build/release/v*/SHA256SUMS
            build/release/v*/release-manifest.json
            build/validation.txt
          if-no-files-found: error
          retention-days: 14
